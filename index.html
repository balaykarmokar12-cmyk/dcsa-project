<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management System - BOU DCSA</title>
  <!-- React & Tailwind CSS CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [students, setStudents] = useState([
        { id: 1, student_id: '2415082008', name: 'Balay Karmaker', email: 'balaykarmokar12@gmail.com', program: 'DCSA', gpa: '3.85' }
      ]);
      const [form, setForm] = useState({ student_id: '', name: '', email: '', program: 'DCSA', gpa: '' });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!form.student_id || !form.name || !form.email) return alert("All fields are required!");

        setStudents([{ ...form, id: Date.now() }, ...students]);
        setForm({ student_id: '', name: '', email: '', program: 'DCSA', gpa: '' });
        alert("Student Added Successfully to System!");
      };

      return (
        <div className="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
          <header className="border-b pb-4 mb-6 text-center">
            <h1 className="text-2xl font-bold text-blue-700">BANGLADESH OPEN UNIVERSITY</h1>
            <h2 className="text-lg font-semibold text-gray-700">DCSA Project: Student Management System</h2>
            <div className="mt-2 text-sm text-gray-600">
              <span><strong>Presented By:</strong> Balay Karmaker</span> | 
              <span> <strong>ID:</strong> 2415082008</span>
            </div>
          </header>

          <!-- Input Form -->
          <form onSubmit={handleSubmit} className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8 bg-blue-50 p-4 rounded-lg">
            <div>
              <label className="block text-sm font-medium mb-1">Student ID</label>
              <input type="text" value={form.student_id} onChange={e=>setForm({...form, student_id: e.target.value})} className="w-full p-2 border rounded" placeholder="2415082008" required />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Full Name</label>
              <input type="text" value={form.name} onChange={e=>setForm({...form, name: e.target.value})} className="w-full p-2 border rounded" placeholder="Student Name" required />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Email</label>
              <input type="email" value={form.email} onChange={e=>setForm({...form, email: e.target.value})} className="w-full p-2 border rounded" placeholder="student@gmail.com" required />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Program & GPA</label>
              <div className="flex gap-2">
                <input type="text" value={form.program} onChange={e=>setForm({...form, program: e.target.value})} className="w-2/3 p-2 border rounded" required />
                <input type="number" step="0.01" value={form.gpa} onChange={e=>setForm({...form, gpa: e.target.value})} className="w-1/3 p-2 border rounded" placeholder="GPA" />
              </div>
            </div>
            <button type="submit" className="md:col-span-2 bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700 transition">
              Add Student to Database
            </button>
          </form>

          <!-- Student List Table -->
          <div>
            <h3 className="text-lg font-bold mb-3 text-gray-800">Database Records</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse border border-gray-200">
                <thead>
                  <tr className="bg-blue-600 text-white">
                    <th className="p-2 border">ID</th>
                    <th className="p-2 border">Name</th>
                    <th className="p-2 border">Email</th>
                    <th className="p-2 border">Program</th>
                    <th className="p-2 border">GPA</th>
                  </tr>
                </thead>
                <tbody>
                  {students.map((s) => (
                    <tr key={s.id} className="hover:bg-gray-50 border-b">
                      <td className="p-2 border font-mono">{s.student_id}</td>
                      <td className="p-2 border font-semibold">{s.name}</td>
                      <td className="p-2 border text-sm">{s.email}</td>
                      <td className="p-2 border">{s.program}</td>
                      <td className="p-2 border">{s.gpa || 'N/A'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
