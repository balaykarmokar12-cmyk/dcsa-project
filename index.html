<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FUTURE NETWORK NOC v5.2 FINAL</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#050a14;--card:#0f1a2e;--b:#1e3a5f;--g:#00ff88;--r:#ff2e63;--bl:#00d4ff;--y:#ffcc00;--t:#e2e8f0;--m:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:monospace;background:var(--bg);color:var(--t)}
#loginPage{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 20% 20%,#0f2a4a 0%,#050a14 70%);display:flex;align-items:center;justify-content:center}
.loginBox{background:#12243f;border:1px solid var(--b);border-radius:20px;padding:35px;width:95%;max-width:400px}
.inp{width:100%;background:#0a152a;border:1px solid var(--b);border-radius:10px;padding:13px;color:#fff;margin-bottom:12px}
.btn{width:100%;background:linear-gradient(90deg,var(--bl),var(--g));border:none;border-radius:10px;padding:13px;color:#000;font-weight:800;cursor:pointer}
.topbar{height:58px;background:#0f1a2e;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:100}
.nav{display:flex;gap:5px;overflow:auto;padding:8px 12px;background:#0a152a;border-bottom:1px solid var(--b);position:sticky;top:58px;z-index:90}
.navBtn{white-space:nowrap;padding:8px 12px;border-radius:8px;border:1px solid var(--b);background:#0f1a2e;color:var(--m);font-size:10px;cursor:pointer}
.navBtn.active{border-color:var(--bl);color:#fff;background:#00d4ff22}
.main{padding:12px;max-width:1400px;margin:0 auto}
.grid{display:grid;gap:10px}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.card{background:#0f1a2e;border:1px solid var(--b);border-radius:14px;padding:14px}
.kTitle{font-size:10px;color:var(--m);margin-bottom:5px}
.kVal{font-size:22px;font-weight:800}
.badge{font-size:10px;padding:3px 7px;border-radius:20px;border:1px solid}
.bg{background:rgba(0,255,136,0.1);border-color:var(--g);color:var(--g)}
.br{background:rgba(255,46,99,0.1);border-color:var(--r);color:var(--r)}
.tableWrap{overflow:auto;border-radius:10px;border:1px solid var(--b)}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:650px}
th{background:#0a152a;color:var(--m);padding:8px 10px;text-align:left;font-size:9px}
td{padding:8px 10px;border-top:1px solid #1e3a5f66}
.iSm{background:#0a152a;border:1px solid var(--b);border-radius:6px;padding:8px;color:#fff;width:100%;font-size:11px}
#map{height:500px;border-radius:14px;border:1px solid var(--b)}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="loginPage"><div class="loginBox"><h1 style="text-align:center;color:var(--bl)">FUTURE NETWORK</h1><p style="color:var(--m);text-align:center;font-size:11px;margin:8px 0 20px">NOC v5.2 FINAL FIXED // AUTO LOGIN</p><input id="u" class="inp" value="Admin"><input id="p" type="password" class="inp" value="@dmin0000"><button class="btn" id="loginBtn" type="button" onclick="goApp()">SECURE LOGIN - TAP TO ENTER</button><p style="color:var(--g);font-size:9px;text-align:center;margin-top:12px">✓ Click করলেই ঢুকে যাবে - No Password Check</p><p style="color:var(--m);font-size:8px;text-align:center;margin-top:6px">Auto login in 3 sec if not clicked</p><div id="loginErr" style="color:var(--r);font-size:10px;margin-top:10px;text-align:center"></div></div></div>
